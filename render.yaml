services:
  - type: web
    name: enertechchatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.10.14"
      - key: PINECONE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PINECONE_INDEX_NAME
        value: enertech-chatbot
      - key: EMBEDDING_MODEL_NAME
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: "384"
